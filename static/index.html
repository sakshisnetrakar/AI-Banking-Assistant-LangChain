<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Banking Assistant</title>
<style>body{font-family:Arial;margin:0;background:#f0f6ff;color:#14233a}main{max-width:740px;margin:45px auto;background:white;border-radius:16px;padding:28px;box-shadow:0 10px 28px #b8cae080}h1{color:#1d4ed8}#chat{height:390px;overflow:auto;border:1px solid #d5dfef;border-radius:12px;padding:12px}.message{padding:10px 12px;margin:10px 0;border-radius:12px;max-width:84%;white-space:pre-wrap}.user{background:#dbeafe;margin-left:auto}.assistant{background:#f1f5f9}form{display:flex;gap:8px;margin-top:14px}input{flex:1;padding:12px;border:1px solid #b6c7df;border-radius:8px}button{border:0;border-radius:8px;background:#1d4ed8;color:white;padding:12px 18px;cursor:pointer}small{color:#637084}</style></head>
<body><main><h1>AI Banking Assistant</h1><small>Training demo. It uses mock FAQ answers and never requests sensitive banking details.</small><div id="chat"><div class="message assistant">Hello! Ask me about home loans, personal loans, car-loan eligibility, debit-card blocking, minimum balance, or EMI.</div></div><form id="form"><input id="input" required placeholder="What documents are required for a home loan?"><button>Send</button></form></main>
<script>let id=null;const chat=document.querySelector('#chat'),input=document.querySelector('#input');function add(text,type){const item=document.createElement('div');item.className='message '+type;item.textContent=text;chat.append(item);chat.scrollTop=chat.scrollHeight}document.querySelector('#form').onsubmit=async event=>{event.preventDefault();const message=input.value.trim();if(!message)return;add(message,'user');input.value='';const response=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,conversation_id:id})});const data=await response.json();id=data.conversation_id;add(data.answer||data.detail,'assistant')};</script></body></html>
